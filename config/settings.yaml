origins: [HAM]
nights: { min: 7, max: 14 }
bridge_days: { before: 0, after: 0 }
max_stops: 2
layovers:
  max_minutes: 180                        # each individual stop
  forbidden_window: ["23:00", "05:00"]    # local time; a stop touching this window is rejected
excluded_airlines: [AI]
providers:
  order:
    - { name: serpapi, monthly_budget: 250 }
    - { name: searchapi, monthly_budget: 100 }
    - { name: fast_flights, pause_seconds: 5 }     # no budget = unlimited
  # All three verified live 2026-09-19: the price is the total for all travellers.
  price_is_total: { serpapi: true, searchapi: true, fast_flights: true }
budget:
  runs_per_month: 4               # Mondays: 4-5 runs/month; shares are capped by real usage
  max_searches_per_run: 120       # hard cap across all providers
  max_pairs_per_route_per_run: 3
deals:
  median_ratio: 0.85
  min_history_points: 3
  renotify_drop_ratio: 0.95
  lookahead_days: 330
alternate_origins:
  home: HAM
  min_saving_ratio: 0.20          # a FRA fare must be >= 20 % cheaper than the best HAM fare
  min_saving_total: 500           # ... and >= 500 EUR cheaper in absolute terms
report:
  output_dir: docs/site
email:
  mode: always
