origins: [HAM]
nights: { min: 7, max: 14 }
bridge_days: { before: 0, after: 0 }
max_stops: 1
excluded_airlines: [AI]
providers:
  primary: serpapi
  backup: fast_flights
  backup_pause_seconds: 5
  # fast_flights verified live (16,824 EUR = 3 travellers); serpapi UNVERIFIED until the first real search
  price_is_total:
    serpapi: true
    fast_flights: true
budget:
  serpapi_per_month: 100
  runs_per_month: 4               # Mondays: 4-5 runs/month; the planner also caps by actual monthly usage
  max_searches_per_run: 60
  max_pairs_per_route_per_run: 3
deals:
  median_ratio: 0.85
  min_history_points: 3
  renotify_drop_ratio: 0.95
  lookahead_days: 330
report:
  output_dir: docs/site
email:
  mode: deals_only
